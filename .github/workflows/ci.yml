name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master, "feat/**"]

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "24"

jobs:
  # ── Fast checks: lint + test + build (all PRs) ──────────────────────────
  affected:
    name: Affected lint/test/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # nx affected needs full history

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Nx deps
        run: pnpm install --frozen-lockfile

      - name: Set Nx base
        run: echo "NX_BASE=origin/${{ github.base_ref || 'master' }}" >> $GITHUB_ENV

      - name: Lint
        run: |
          if command -v golangci-lint &>/dev/null; then
            npx nx affected -t lint --base=$NX_BASE --head=HEAD || true
          else
            go vet ./...
          fi

      - name: Unit tests
        run: go test ./pkg/... ./libs/... ./test/... -count=1 -timeout 120s

      - name: Build
        run: make build

  # ── Integration tests (protected branches only) ─────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'push'
    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/password123
        ports:
          - 7687:7687
        options: >-
          --health-cmd "neo4j status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.9.0
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/readyz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password123
        run: go test ./test/... -tags=integration -timeout 300s

  # ── Nightly smoke tests ──────────────────────────────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build and smoke
        run: |
          make build
          ./bin/codegraph --help
          ./bin/codegraph status || true
