name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master, "feat/**"]

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "24"

jobs:
  # ── Fast checks: lint + test + build (all PRs) ──────────────────────────
  affected:
    name: Lint/test/build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Lint
        run: |
          if command -v golangci-lint &>/dev/null; then
            golangci-lint run ./...
          else
            go vet ./...
          fi

      - name: Unit tests
        # Exclude test/integration — those need Neo4j and run in the integration job
        run: make test

      - name: Build
        run: make build

  # ── Integration tests (protected branches only) ─────────────────────────
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'push'
    services:
      neo4j:
        image: neo4j:5.15
        env:
          NEO4J_AUTH: neo4j/password123
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Integration tests
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USERNAME: neo4j
          NEO4J_PASSWORD: password123
        run: go test -v ./test/integration/... -timeout 300s

  # ── Chat UI: typecheck + unit tests + Playwright e2e ────────────────────
  chat-ui:
    name: Chat UI (check + unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install deps
        working-directory: web/chat-ui
        run: pnpm install

      - name: Typecheck
        working-directory: web/chat-ui
        run: pnpm check

      - name: Unit tests
        working-directory: web/chat-ui
        run: pnpm test:unit

      - name: Install Playwright browsers
        working-directory: web/chat-ui
        run: pnpm exec playwright install --with-deps chromium

      - name: E2e tests
        working-directory: web/chat-ui
        # OPENAI_API_KEY is a dummy — e2e tests mock /api/chat at network level
        env:
          OPENAI_API_KEY: e2e-mock-key-not-used
          CI: true
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/chat-ui/playwright-report/
          retention-days: 7

  # ── Nightly smoke tests ──────────────────────────────────────────────────
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build and smoke
        run: |
          make build
          ./bin/codegraph --help
          ./bin/codegraph status || true
