name: Quality Gate

on:
  pull_request:
    branches: [master, "feat/**"]

env:
  GO_VERSION: "1.24"

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Eval tests (blocking gate)
        run: go test ./libs/evals-go/... -count=1 -timeout 120s -v -run 'TestQualityGateEnforcement|TestWriteMetricsArtifact|TestLoadGoldenDatasets'

      - name: Generate quality gate report
        if: always()
        run: |
          go test ./libs/evals-go/... -count=1 -timeout 60s -run TestWriteMetricsArtifact -v > quality-gate-report.txt 2>&1 || true
          # Also produce JSON artifact via test helper
          cd libs/evals-go && go test -count=1 -run TestWriteMetricsArtifact -v 2>&1 | tail -50 > ../../quality-gate-output.txt || true

      - name: Upload quality gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-report
          path: |
            quality-gate-report.txt
            quality-gate-output.txt
          retention-days: 30

      - name: Quality Gate (generation, verification, provenance)
        run: go test ./libs/generation-go/... ./libs/verification-go/... ./libs/intelligence-go/provenance/... -count=1 -timeout 120s
