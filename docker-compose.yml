version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: code-graph-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc","apoc-extended"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
      # Updated memory settings for newer Neo4j (fix deprecated warnings)
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
      # Connection and performance tuning
      - NEO4J_dbms_connector_bolt_thread__pool__max__size=20
      - NEO4J_dbms_connector_bolt_thread__pool__min__size=5
      - NEO4J_db_transaction_timeout=60s
      - NEO4J_dbms_transaction_timeout=60s
      # APOC settings
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a web interface for Neo4j browser
  neo4j-browser:
    image: neo4j:5.15-community
    container_name: code-graph-browser
    ports:
      - "7475:7474"
    environment:
      - NEO4J_AUTH=neo4j/password123
    depends_on:
      - neo4j
    profiles:
      - browser

  # GraphQL API Server
  graphql-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: code-graph-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - NEO4J_DATABASE=neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - default
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:

# Development network
networks:
  default:
    name: code-graph-network