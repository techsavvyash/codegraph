version: '3.8'

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: code-graph-neo4j
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password123
      # GDS plugin is installed manually: download neo4j-graph-data-science-2.13.2.jar
      # to ./plugins/ and it will be mounted into the container. See scripts/setup-gds.sh.
      - NEO4J_PLUGINS=[]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*,gds.*
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
      # Updated memory settings for newer Neo4j (fix deprecated warnings)
      - NEO4J_server_memory_heap_initial__size=1g
      - NEO4J_server_memory_heap_max__size=3g
      - NEO4J_server_memory_pagecache_size=1g
      # Connection and performance tuning
      - NEO4J_dbms_connector_bolt_thread__pool__max__size=20
      - NEO4J_dbms_connector_bolt_thread__pool__min__size=5
      - NEO4J_db_transaction_timeout=0
      - NEO4J_dbms_transaction_timeout=0
      # APOC settings
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_import_file_use__neo4j__config=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: code-graph-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333 && echo -e 'GET /healthz HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    container_name: code-graph-opensearch
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms256m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Optional: Add a web interface for Neo4j browser
  neo4j-browser:
    image: neo4j:5.26-community
    container_name: code-graph-browser
    ports:
      - "7475:7474"
    environment:
      - NEO4J_AUTH=neo4j/password123
    depends_on:
      - neo4j
    profiles:
      - browser

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  qdrant_storage:
  opensearch_data:

# Development network
networks:
  default:
    name: code-graph-network