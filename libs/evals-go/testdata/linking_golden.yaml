name: "Linking Golden Set"
description: "Ground-truth queries for evaluating document-to-code linking quality across 3 domains"
version: "1.0.0"
defaultK: 10

queries:
  # --- Domain: API (HTTP handlers, routes, controllers) ---
  - id: link-api-01
    query: "user authentication endpoint"
    description: "Link auth docs to authentication handler code"
    category: api
    expected:
      - nodeKey: "func:auth_handler.go#HandleLogin"
        grade: 3
        nodeType: Function
        comment: "Primary login handler"
      - nodeKey: "func:auth_handler.go#HandleLogout"
        grade: 2
        nodeType: Function
        comment: "Logout handler in same auth domain"
      - nodeKey: "func:middleware.go#AuthMiddleware"
        grade: 2
        nodeType: Function
        comment: "Auth middleware supporting the endpoint"

  - id: link-api-02
    query: "REST API rate limiting"
    description: "Link rate limiting docs to implementation"
    category: api
    expected:
      - nodeKey: "func:rate_limiter.go#RateLimitMiddleware"
        grade: 3
        nodeType: Function
        comment: "Rate limiting middleware"
      - nodeKey: "func:rate_limiter.go#NewRateLimiter"
        grade: 2
        nodeType: Function
        comment: "Rate limiter constructor"

  - id: link-api-03
    query: "API response serialization JSON"
    description: "Link serialization docs to response formatting code"
    category: api
    expected:
      - nodeKey: "func:response.go#WriteJSON"
        grade: 3
        nodeType: Function
        comment: "JSON response writer"
      - nodeKey: "func:response.go#ErrorResponse"
        grade: 2
        nodeType: Function
        comment: "Error response formatter"

  # --- Domain: Data (database, storage, queries) ---
  - id: link-data-01
    query: "database connection pooling"
    description: "Link connection pool docs to pool implementation"
    category: data
    expected:
      - nodeKey: "func:pool.go#NewConnectionPool"
        grade: 3
        nodeType: Function
        comment: "Connection pool constructor"
      - nodeKey: "method:pool.go#ConnectionPool.Acquire"
        grade: 2
        nodeType: Method
        comment: "Connection acquisition"
      - nodeKey: "method:pool.go#ConnectionPool.Release"
        grade: 2
        nodeType: Method
        comment: "Connection release"

  - id: link-data-02
    query: "graph query builder cypher"
    description: "Link Cypher query docs to query builder"
    category: data
    expected:
      - nodeKey: "func:query_builder.go#BuildCypher"
        grade: 3
        nodeType: Function
        comment: "Cypher query builder"
      - nodeKey: "func:query_builder.go#ParameterizedQuery"
        grade: 2
        nodeType: Function
        comment: "Parameterized query helper"

  - id: link-data-03
    query: "data migration schema versioning"
    description: "Link migration docs to migration runner"
    category: data
    expected:
      - nodeKey: "func:migration.go#RunMigrations"
        grade: 3
        nodeType: Function
        comment: "Migration runner entry point"
      - nodeKey: "func:migration.go#MigrationVersion"
        grade: 2
        nodeType: Function
        comment: "Version tracking"

  # --- Domain: Async/Messaging (workers, consumers, events) ---
  - id: link-async-01
    query: "message queue consumer processing"
    description: "Link consumer docs to message processing code"
    category: async
    expected:
      - nodeKey: "func:consumer.go#ProcessMessage"
        grade: 3
        nodeType: Function
        comment: "Main message processor"
      - nodeKey: "func:consumer.go#NewConsumer"
        grade: 2
        nodeType: Function
        comment: "Consumer constructor"

  - id: link-async-02
    query: "background job worker scheduling"
    description: "Link job scheduling docs to worker implementation"
    category: async
    expected:
      - nodeKey: "func:worker.go#RunWorker"
        grade: 3
        nodeType: Function
        comment: "Worker runner"
      - nodeKey: "func:scheduler.go#ScheduleJob"
        grade: 2
        nodeType: Function
        comment: "Job scheduler"

  - id: link-async-03
    query: "event sourcing publish subscribe"
    description: "Link event docs to pub/sub implementation"
    category: async
    expected:
      - nodeKey: "func:events.go#PublishEvent"
        grade: 3
        nodeType: Function
        comment: "Event publisher"
      - nodeKey: "func:events.go#SubscribeToEvents"
        grade: 3
        nodeType: Function
        comment: "Event subscriber"
      - nodeKey: "func:events.go#EventHandler"
        grade: 2
        nodeType: Function
        comment: "Event handler interface implementation"
