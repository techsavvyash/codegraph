name: "Flow Derivation Golden Set"
description: "Ground-truth flows for evaluating flow derivation quality across 3 domains"
version: "1.0.0"
defaultK: 15

queries:
  # --- Domain: API (HTTP request flows) ---
  - id: flow-api-01
    query: "user creation request flow"
    description: "Trace the flow from HTTP request to user creation in database"
    category: api
    expected:
      - nodeKey: "func:handler.go#HandleCreateUser"
        grade: 3
        nodeType: Function
        comment: "Entry point - HTTP handler"
      - nodeKey: "func:service.go#CreateUser"
        grade: 3
        nodeType: Function
        comment: "Business logic - user creation"
      - nodeKey: "func:repository.go#InsertUser"
        grade: 3
        nodeType: Function
        comment: "Data layer - database insert"
      - nodeKey: "func:validator.go#ValidateUserInput"
        grade: 2
        nodeType: Function
        comment: "Input validation step"

  - id: flow-api-02
    query: "authentication login flow"
    description: "Trace login from handler to token generation"
    category: api
    expected:
      - nodeKey: "func:auth.go#HandleLogin"
        grade: 3
        nodeType: Function
        comment: "Login handler entry"
      - nodeKey: "func:auth.go#VerifyCredentials"
        grade: 3
        nodeType: Function
        comment: "Credential verification"
      - nodeKey: "func:token.go#GenerateToken"
        grade: 3
        nodeType: Function
        comment: "Token generation"

  - id: flow-api-03
    query: "search query execution flow"
    description: "Trace search from API to results"
    category: api
    expected:
      - nodeKey: "func:search_handler.go#HandleSearch"
        grade: 3
        nodeType: Function
        comment: "Search API handler"
      - nodeKey: "func:search_service.go#ExecuteSearch"
        grade: 3
        nodeType: Function
        comment: "Search orchestration"
      - nodeKey: "func:search_service.go#MergeResults"
        grade: 2
        nodeType: Function
        comment: "Result merging"

  # --- Domain: Data (data processing pipelines) ---
  - id: flow-data-01
    query: "indexing pipeline data flow"
    description: "Trace data through the indexing pipeline stages"
    category: data
    expected:
      - nodeKey: "func:pipeline.go#RunPipeline"
        grade: 3
        nodeType: Function
        comment: "Pipeline entry point"
      - nodeKey: "func:pipeline.go#ParseStage"
        grade: 3
        nodeType: Function
        comment: "Parsing stage"
      - nodeKey: "func:pipeline.go#TransformStage"
        grade: 3
        nodeType: Function
        comment: "Transform stage"
      - nodeKey: "func:pipeline.go#PersistStage"
        grade: 3
        nodeType: Function
        comment: "Persistence stage"

  - id: flow-data-02
    query: "batch import data processing"
    description: "Trace batch import flow"
    category: data
    expected:
      - nodeKey: "func:importer.go#ImportBatch"
        grade: 3
        nodeType: Function
        comment: "Batch import entry"
      - nodeKey: "func:importer.go#ValidateRecords"
        grade: 2
        nodeType: Function
        comment: "Record validation"
      - nodeKey: "func:importer.go#BulkInsert"
        grade: 3
        nodeType: Function
        comment: "Bulk database insert"

  - id: flow-data-03
    query: "cache lookup and refresh flow"
    description: "Trace cache check to refresh to read-through"
    category: data
    expected:
      - nodeKey: "func:cache.go#Get"
        grade: 3
        nodeType: Function
        comment: "Cache lookup"
      - nodeKey: "func:cache.go#Refresh"
        grade: 3
        nodeType: Function
        comment: "Cache refresh"
      - nodeKey: "func:store.go#FetchFromSource"
        grade: 2
        nodeType: Function
        comment: "Source data fetch"

  # --- Domain: Async (event-driven flows) ---
  - id: flow-async-01
    query: "order processing event flow"
    description: "Trace order from receipt to fulfillment"
    category: async
    expected:
      - nodeKey: "func:order.go#ReceiveOrder"
        grade: 3
        nodeType: Function
        comment: "Order receipt"
      - nodeKey: "func:order.go#ValidateOrder"
        grade: 3
        nodeType: Function
        comment: "Order validation"
      - nodeKey: "func:order.go#ProcessPayment"
        grade: 3
        nodeType: Function
        comment: "Payment processing"
      - nodeKey: "func:order.go#FulfillOrder"
        grade: 3
        nodeType: Function
        comment: "Order fulfillment"

  - id: flow-async-02
    query: "notification dispatch pipeline"
    description: "Trace notification from trigger to delivery"
    category: async
    expected:
      - nodeKey: "func:notification.go#TriggerNotification"
        grade: 3
        nodeType: Function
        comment: "Notification trigger"
      - nodeKey: "func:notification.go#FormatMessage"
        grade: 2
        nodeType: Function
        comment: "Message formatting"
      - nodeKey: "func:notification.go#Deliver"
        grade: 3
        nodeType: Function
        comment: "Message delivery"

  - id: flow-async-03
    query: "retry and dead letter queue flow"
    description: "Trace message retry logic and DLQ routing"
    category: async
    expected:
      - nodeKey: "func:retry.go#ProcessWithRetry"
        grade: 3
        nodeType: Function
        comment: "Retry wrapper"
      - nodeKey: "func:retry.go#ShouldRetry"
        grade: 2
        nodeType: Function
        comment: "Retry decision logic"
      - nodeKey: "func:dlq.go#SendToDeadLetter"
        grade: 3
        nodeType: Function
        comment: "Dead letter queue routing"
