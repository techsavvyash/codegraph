name: "Citation Validity Golden Set"
description: "Ground-truth for evaluating generated documentation citation quality across 3 domains"
version: "1.0.0"
defaultK: 10

queries:
  # --- Domain: API (generated API docs should cite handlers/routes) ---
  - id: cite-api-01
    query: "user management API documentation"
    description: "Generated docs about user CRUD should cite all relevant handlers"
    category: api
    expected:
      - nodeKey: "func:user_handler.go#HandleCreateUser"
        grade: 3
        nodeType: Function
        comment: "Must be cited in user creation docs"
      - nodeKey: "func:user_handler.go#HandleGetUser"
        grade: 3
        nodeType: Function
        comment: "Must be cited in user retrieval docs"
      - nodeKey: "func:user_handler.go#HandleUpdateUser"
        grade: 2
        nodeType: Function
        comment: "Should be cited in user update docs"
      - nodeKey: "func:user_handler.go#HandleDeleteUser"
        grade: 2
        nodeType: Function
        comment: "Should be cited in user deletion docs"

  - id: cite-api-02
    query: "error handling middleware documentation"
    description: "Generated error handling docs should cite middleware and error types"
    category: api
    expected:
      - nodeKey: "func:error_handler.go#ErrorMiddleware"
        grade: 3
        nodeType: Function
        comment: "Primary error handler"
      - nodeKey: "func:errors.go#NewAppError"
        grade: 2
        nodeType: Function
        comment: "Application error constructor"

  - id: cite-api-03
    query: "API versioning strategy documentation"
    description: "Generated versioning docs should cite router and version handlers"
    category: api
    expected:
      - nodeKey: "func:router.go#SetupRoutes"
        grade: 3
        nodeType: Function
        comment: "Route setup with versioning"
      - nodeKey: "func:router.go#VersionedHandler"
        grade: 2
        nodeType: Function
        comment: "Version-specific handler wrapper"

  # --- Domain: Data (generated schema/model docs) ---
  - id: cite-data-01
    query: "graph schema documentation with node types"
    description: "Generated schema docs should cite all node type definitions"
    category: data
    expected:
      - nodeKey: "func:schema.go#CreateConstraints"
        grade: 3
        nodeType: Function
        comment: "Schema constraint creation"
      - nodeKey: "func:schema.go#CreateIndexes"
        grade: 3
        nodeType: Function
        comment: "Schema index creation"
      - nodeKey: "func:models.go#FunctionNode"
        grade: 2
        nodeType: Function
        comment: "Function node model"

  - id: cite-data-02
    query: "data migration procedure documentation"
    description: "Generated migration docs should cite migration steps"
    category: data
    expected:
      - nodeKey: "func:migrate.go#MigrateUp"
        grade: 3
        nodeType: Function
        comment: "Forward migration"
      - nodeKey: "func:migrate.go#MigrateDown"
        grade: 2
        nodeType: Function
        comment: "Rollback migration"
      - nodeKey: "func:migrate.go#GetCurrentVersion"
        grade: 2
        nodeType: Function
        comment: "Version checker"

  - id: cite-data-03
    query: "vector index configuration documentation"
    description: "Generated vector docs should cite vector store setup"
    category: data
    expected:
      - nodeKey: "func:vector_store.go#CreateCollection"
        grade: 3
        nodeType: Function
        comment: "Collection creation"
      - nodeKey: "func:vector_store.go#ConfigureIndex"
        grade: 2
        nodeType: Function
        comment: "Index configuration"

  # --- Domain: Async (generated event/message docs) ---
  - id: cite-async-01
    query: "event processing architecture documentation"
    description: "Generated event docs should cite all event handlers"
    category: async
    expected:
      - nodeKey: "func:event_bus.go#Publish"
        grade: 3
        nodeType: Function
        comment: "Event publishing"
      - nodeKey: "func:event_bus.go#Subscribe"
        grade: 3
        nodeType: Function
        comment: "Event subscription"
      - nodeKey: "func:event_bus.go#HandleEvent"
        grade: 2
        nodeType: Function
        comment: "Event handling"

  - id: cite-async-02
    query: "worker pool documentation"
    description: "Generated worker docs should cite pool management"
    category: async
    expected:
      - nodeKey: "func:pool.go#NewWorkerPool"
        grade: 3
        nodeType: Function
        comment: "Pool constructor"
      - nodeKey: "func:pool.go#Submit"
        grade: 2
        nodeType: Function
        comment: "Task submission"
      - nodeKey: "func:pool.go#Shutdown"
        grade: 2
        nodeType: Function
        comment: "Graceful shutdown"

  - id: cite-async-03
    query: "message retry and backoff documentation"
    description: "Generated retry docs should cite retry logic"
    category: async
    expected:
      - nodeKey: "func:retry.go#WithRetry"
        grade: 3
        nodeType: Function
        comment: "Retry wrapper"
      - nodeKey: "func:retry.go#ExponentialBackoff"
        grade: 3
        nodeType: Function
        comment: "Backoff strategy"
      - nodeKey: "func:retry.go#MaxRetries"
        grade: 2
        nodeType: Function
        comment: "Retry limit configuration"
